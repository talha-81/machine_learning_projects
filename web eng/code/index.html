<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Event Finder</title>
    <link rel="stylesheet" href="styles.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Local Event Finder</h1>
        <nav>
            <a href="#" onclick="showAllEvents()">Home</a>
            <a href="#" onclick="showFavorites()">Favorites</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <section class="filter-section">
        <select id="categoryFilter" onchange="applyFilters()">
            <option value="">All Categories</option>
            <option value="Music">Music</option>
            <option value="Art">Art</option>
            <option value="Technology">Technology</option>
            <option value="Festival">Festival</option>
            <option value="Workshop">Workshop</option>
        </select>
        <input type="date" id="dateFilter" onchange="applyFilters()">
        <input type="text" id="locationFilter" placeholder="Enter location" oninput="applyFilters()">
        <button onclick="clearFilters()">Clear Filters</button>
    </section>

    <section class="events-grid" id="eventsGrid"></section>

    <footer id="about">
        <h2>About This App</h2>
        <p>This project helps you explore local events based on category, location, and date.<br>
           Built with HTML, CSS, and JavaScript.</p>
        <p>© 2025 Local Event Finder</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
